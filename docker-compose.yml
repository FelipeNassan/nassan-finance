services:
  postgres:
    image: postgres:16
    container_name: fortn-db
    restart: unless-stopped
    # Credenciais vêm do .env (nunca hardcode aqui). Veja .env.example.
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: ${DB_DATABASE:-fortn}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
